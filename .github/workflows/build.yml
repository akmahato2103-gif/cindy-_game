name: Build RenPy APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Unzip Project
        run: |
          unzip CindyGame.zip

      - name: Setup RenPy Web/Android Builder
        uses: PyTom/renpy-build-action@v1
        with:
          game-path: '.'

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v3
        with:
          name: CindyNovel-APK
          path: "**.apk"
